name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.7.2
      - run: ruff check dataset/ server/ scripts/ training/

  # training/, dataset/, and scripts/ share one dependency set (torch,
  # transformers, peft, opencv, onnx...), so they're import-checked together
  # against a single CPU-only environment. GPU-only packages are swapped for
  # CPU/plain equivalents so this runs on a standard CI runner: torch's CUDA
  # 12.1 wheel -> CPU wheel, onnxruntime-gpu -> onnxruntime. bitsandbytes is
  # skipped entirely -- none of these modules `import bitsandbytes` directly,
  # they only reference transformers' BitsAndBytesConfig (a plain dataclass,
  # importable without bitsandbytes installed; bitsandbytes itself is only
  # required at actual 4-bit *load* time, which an import check never
  # triggers).
  import-check-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU-friendly training/dataset/scripts dependencies
        run: |
          grep -vE '^(torch==|torchvision==|bitsandbytes|onnxruntime-gpu|--extra-index-url)' training/requirements.txt > /tmp/ci-requirements.txt
          echo "onnxruntime==1.19.2" >> /tmp/ci-requirements.txt
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/ci-requirements.txt
      - name: Import check
        run: python .github/scripts/import_check.py training dataset scripts

  import-check-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU-friendly server dependencies
        run: |
          grep -vE '^(torch==|bitsandbytes|--extra-index-url)' server/requirements.txt > /tmp/ci-requirements.txt
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/ci-requirements.txt
      - name: Import check
        run: python .github/scripts/import_check.py server
